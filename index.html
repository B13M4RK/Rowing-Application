<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rudertraining App - Mentoren-Portal</title>

<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
    --bg:#f5f5f7;
    --card:#fff;
    --text:#1d1d1f;
    --sub:#6e6e73;
    --blue:#007aff;
    --border:rgba(0,0,0,0.08);
}

body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,Arial;
    background:var(--bg);
    color:var(--text);
}

.page{display:none;padding-bottom:70px;}
.page.active{display:block;}

.card{
    background:#fff;
    margin:12px;
    padding:14px;
    border-radius:16px;
    box-shadow:0 6px 18px rgba(0,0,0,0.06);
}

input,select{
    width:100%;
    padding:10px;
    margin:6px 0;
    border-radius:12px;
    border:1px solid var(--border);
    background:#fafafa;
    box-sizing: border-box;
}

button{
    width:100%;
    padding:10px;
    margin-top:6px;
    border-radius:12px;
    border:none;
    background:var(--blue);
    color:white;
    font-weight:600;
    cursor:pointer;
}

button.secondary{
    background:#e5e5ea;
    color:#333;
}

.item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    padding:8px;
    border-bottom:1px solid var(--border);
}

.delete{
    width:32px;
    height:32px;
    background:#ff3b30;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    border-radius:8px;
    cursor:pointer;
}

.nav{
    position:fixed;
    bottom:0; left:0; right:0;
    height:60px;
    background:white;
    border-top:1px solid var(--border);
    display:none;
}

.nav button{
    flex:1;
    background:none;
    color:var(--sub);
    margin:0;
}

.nav button.active{ color:var(--blue); }

.calendar{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:6px;
    text-align:center;
}

.day{
    padding:10px;
    background:#f2f2f5;
    border-radius:12px;
    font-size:12px;
    color:#333;
}

.day.training{ color:white; }
.day.water{ background:#4da3ff; }
.day.gym{ background:#32863d; }

.calNav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.calBtn{
    border:none;
    background:transparent;
    color:#9aa0a6;
    font-size:18px;
    cursor:pointer;
    width:auto;
}

.monthLabel{ font-size:12px; color:#8a8a8f; }

.statsFilter{
    display:flex;
    gap:6px;
    margin:10px 12px 0 12px;
}

.statsFilter button{
    flex:1;
    padding:8px;
    border-radius:10px;
    border:1px solid var(--border);
    background:#f2f2f5;
    color:#333;
    font-weight:500;
}

.statsFilter button.active{
    background:var(--blue);
    color:white;
    border-color:transparent;
}

#authMessage {
    font-size: 13px;
    margin-top: 10px;
    text-align: center;
}

.mentorBadge {
    font-size: 12px;
    color: var(--sub);
    background: #f2f2f5;
    padding: 4px 8px;
    border-radius: 8px;
    display: inline-block;
    margin-top: 4px;
}

.offlineAlert {
    background: #ffcc00;
    color: #333;
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 8px;
    margin-bottom: 10px;
    display: none;
}
</style>
</head>

<body>

<!-- MENTOREN ERSTELLEN (Nur beim allerersten Mal) -->
<div id="authPage" class="page active">
    <div class="card" style="margin-top: 40px;">
        <h2 style="text-align:center; margin-top:0;">🚣 Ruder-App</h2>
        <p style="text-align:center; color:var(--sub); font-size:14px;">Mentor-Profil erstellen</p>
        
        <input type="text" id="mentorName" placeholder="Dein Name oder Kürzel (z.B. Alex)">
        <input type="email" id="email" placeholder="E-Mail-Adresse (optional)">
        
        <button id="registerBtn">Mentor-Profil einmalig festlegen</button>
        
        <div id="authMessage"></div>
    </div>
</div>

<!-- TRAINING -->
<div id="training" class="page">
<div class="card">
<div id="offlineNotice" class="offlineAlert">⚠️ Nur lokal gespeichert. Füge deine Supabase-Daten ein, um mit dem PC zu synchronisieren!</div>
<div>
    <h3 style="margin:0;">🚣 Training hinzufügen</h3>
    <div id="currentUserBadge" class="mentorBadge">Mentor: -</div>
</div>

<input type="date" id="date" style="margin-top:14px;">
<select id="type">
    <option>Wasser</option>
    <option>Kraftraum</option>
</select>

<input id="search" placeholder="Person suchen">
<div id="suggestions"></div>
<div id="selected"></div>

<button id="addTraining">Einheit speichern</button>
</div>
</div>

<!-- PERSONEN -->
<div id="people" class="page">
<div class="card">
<h3>👥 Person hinzufügen</h3>
<input id="first" placeholder="Vorname">
<input id="last" placeholder="Nachname">
<button id="addPerson">Hinzufügen</button>
</div>

<div class="card">
<h3>📋 Personenliste</h3>
<div id="peopleList"></div>
</div>
</div>

<!-- STATS -->
<div id="stats" class="page">
<div class="card">
<h3>📅 Kalender</h3>
<div class="calNav">
    <button id="prevMonth" class="calBtn">‹</button>
    <div class="monthLabel" id="monthLabel"></div>
    <button id="nextMonth" class="calBtn">›</button>
</div>
<div id="calendar" class="calendar"></div>
</div>

<div class="card">
<h3>📊 Statistik</h3>
<div class="statsFilter">
    <button data-filter="all" class="active">Alle</button>
    <button data-filter="Wasser">Wasser</button>
    <button data-filter="Kraftraum">Kraftraum</button>
</div>
<div id="statsList" style="margin-top:10px;"></div>
</div>
</div>

<!-- NAVIGATION -->
<div class="nav" id="mainNav">
    <button data-page="people">Personen</button>
    <button class="active" data-page="training">Training</button>
    <button data-page="stats">Stats</button>
</div>

<script>
// ⚠️ Setze hier deine echten Supabase-Zugangsdaten ein!
const SUPABASE_URL = "https://DEIN_PROJEKT.supabase.co";
const SUPABASE_KEY = "DEIN_ANON_KEY";

let db = null;
if (typeof supabase !== "undefined" && SUPABASE_URL.includes("http") && !SUPABASE_URL.includes("DEIN_PROJEKT")) {
    try { db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch(e) {}
}

let currentMentor = null;

const state = {
    people: JSON.parse(localStorage.getItem("people") || "[]"),
    trainings: JSON.parse(localStorage.getItem("trainings") || "[]"),
    selected: [],
    statsFilter: "all"
};

let currentMonth = new Date();

// AUTOMATISCHER START OHNE LOGOUT-OPTION
function autoLogin() {
    const savedMentor = localStorage.getItem("currentMentor");
    
    if (savedMentor) {
        currentMentor = JSON.parse(savedMentor);
        document.getElementById("currentUserBadge").textContent = `Mentor: ${currentMentor.name}`;
        document.getElementById("authPage").classList.remove("active");
        document.getElementById("training").classList.add("active");
        document.getElementById("mainNav").style.display = "flex";
        syncData();
    } else {
        document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
        document.getElementById("authPage").classList.add("active");
        document.getElementById("mainNav").style.display = "none";
    }
}

// PROFIL EINMALIG SPEICHERN
document.getElementById("registerBtn").onclick = () => {
    const name = document.getElementById("mentorName").value.trim();
    const email = document.getElementById("email").value.trim();
    const msg = document.getElementById("authMessage");

    if (!name) {
        msg.style.color = "#ff3b30";
        msg.textContent = "Bitte gib deinen Namen ein.";
        return;
    }

    currentMentor = { id: Date.now(), name: name, email: email };
    localStorage.setItem("currentMentor", JSON.stringify(currentMentor));
    autoLogin();
};

// DATEN ZWISCHEN HANDY UND PC SYNCHRONISIEREN (inkl. Upload von alten offline Daten)
async function syncData() {
    let cloudWorked = false;

    if (db) {
        try {
            // 1. Zuerst schauen, ob lokal auf dem Handy Daten liegen
            const localPeople = JSON.parse(localStorage.getItem("people") || "[]");
            const localTrainings = JSON.parse(localStorage.getItem("trainings") || "[]");

            // 2. Bestehende Cloud-Daten abrufen
            const { data: cloudPeople } = await db.from("people").select("*");
            const { data: cloudTrainings } = await db.from("trainings").select("*");

            // 3. Fehlende lokale Personen nach Supabase hochladen
            if (localPeople.length > 0) {
                const cloudIds = (cloudPeople || []).map(p => p.id);
                const missingPeople = localPeople.filter(p => !cloudIds.includes(p.id));
                if (missingPeople.length > 0) {
                    await db.from("people").insert(missingPeople);
                }
            }

            // 4. Fehlende lokale Trainings nach Supabase hochladen
            if (localTrainings.length > 0) {
                const cloudIds = (cloudTrainings || []).map(t => t.id);
                const missingTrainings = localTrainings.filter(t => !cloudIds.includes(t.id));
                if (missingTrainings.length > 0) {
                    await db.from("trainings").insert(missingTrainings);
                }
            }

            // 5. Frischen, zusammengeführten Stand aus der Cloud holen
            const { data: pData, error: pErr } = await db.from("people").select("*");
            const { data: tData, error: tErr } = await db.from("trainings").select("*");

            if (!pErr && !tErr) {
                state.people = pData || [];
                state.trainings = tData || [];
                cloudWorked = true;
            }
        } catch (e) {
            cloudWorked = false;
        }
    }

    if (!cloudWorked) {
        document.getElementById("offlineNotice").style.display = "block";
        localStorage.setItem("people", JSON.stringify(state.people));
        localStorage.setItem("trainings", JSON.stringify(state.trainings));
    } else {
        document.getElementById("offlineNotice").style.display = "none";
        localStorage.setItem("people", JSON.stringify(state.people));
        localStorage.setItem("trainings", JSON.stringify(state.trainings));
    }

    render();
}

// TRAINING SPEICHERN
document.getElementById("addTraining").onclick = async () => {
    const d = document.getElementById("date").value;
    const t = document.getElementById("type").value;

    if (!d) return alert("Bitte wähle ein Datum aus.");

    const newTraining = {
        id: Date.now(),
        date: d,
        type: t,
        people: [...state.selected],
        mentor_name: currentMentor ? currentMentor.name : "Unbekannt"
    };

    state.trainings.push(newTraining);

    if (db) {
        try { await db.from("trainings").insert([newTraining]); } catch(e) {}
    }

    state.selected = [];
    syncData();
};

// PERSON HINZUFÜGEN
document.getElementById("addPerson").onclick = async () => {
    const f = document.getElementById("first");
    const l = document.getElementById("last");

    if (!f.value.trim() || !l.value.trim()) return;

    const newPerson = { id: Date.now(), f: f.value.trim(), l: l.value.trim() };
    state.people.push(newPerson);

    if (db) {
        try { await db.from("people").insert([newPerson]); } catch(e) {}
    }

    f.value = ""; l.value = "";
    syncData();
};

// PERSON LÖSCHEN
async function deletePerson(id) {
    state.people = state.people.filter(p => p.id !== id);
    if (db) {
        try { await db.from("people").delete().eq("id", id); } catch(e) {}
    }
    syncData();
}

// NAV SWITCH
document.querySelectorAll("#mainNav button").forEach(btn=>{
    btn.onclick=()=>{
        document.querySelectorAll("#mainNav button").forEach(b=>b.classList.remove("active"));
        btn.classList.add("active");

        document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
        document.getElementById(btn.dataset.page).classList.add("active");
    };
});

/* SEARCH & SELECTED */
document.getElementById("search").oninput=(e)=>{
    const val=e.target.value.toLowerCase();
    const box=document.getElementById("suggestions");
    box.innerHTML="";
    if(!val) return;

    state.people
    .filter(p=>(p.f+" "+p.l).toLowerCase().includes(val))
    .forEach(p=>{
        const div=document.createElement("div");
        div.style.padding = "6px"; div.style.cursor = "pointer";
        div.textContent=p.f+" "+p.l;
        div.onclick=()=>{
            if(!state.selected.includes(p.id)){
                state.selected.push(p.id);
                renderSelected();
            }
            document.getElementById("search").value = "";
            document.getElementById("suggestions").innerHTML = "";
        };
        box.appendChild(div);
    });
};

function renderSelected(){
    const div=document.getElementById("selected");
    div.innerHTML="";
    state.selected.forEach(id=>{
        const p=state.people.find(x=>x.id===id);
        if(!p) return;
        const el=document.createElement("div");
        el.className="item";
        el.innerHTML=`${p.f} ${p.l} <span style="color:red;cursor:pointer;">✕</span>`;
        el.querySelector("span").onclick=()=>{
            state.selected=state.selected.filter(x=>x!==id);
            renderSelected();
        };
        div.appendChild(el);
    });
}

function renderPeople(){
    const div=document.getElementById("peopleList");
    div.innerHTML="";
    state.people.forEach(p=>{
        const el=document.createElement("div");
        el.className="item";
        el.innerHTML = `<div>${p.f} ${p.l}</div><div class="delete" onclick="deletePerson(${p.id})">×</div>`;
        div.appendChild(el);
    });
}

function renderCalendar(){
    const div = document.getElementById("calendar");
    const label = document.getElementById("monthLabel");
    div.innerHTML = "";

    const y = currentMonth.getFullYear();
    const m = currentMonth.getMonth();
    const months = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];

    label.textContent = `${months[m]} ${y}`;
    const firstDay = new Date(y, m, 1).getDay();
    const days = new Date(y, m + 1, 0).getDate();
    const offset = firstDay === 0 ? 6 : firstDay - 1;

    for(let i = 0; i < offset; i++) div.appendChild(document.createElement("div"));

    for(let d = 1; d <= days; d++){
        const dateStr = `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
        const training = state.trainings.find(t => t.date === dateStr);
        const el = document.createElement("div");
        el.className = "day";
        el.textContent = d;

        if(training){
            el.classList.add("training");
            if(training.type === "Wasser") el.classList.add("water");
            if(training.type === "Kraftraum") el.classList.add("gym");
        }
        div.appendChild(el);
    }
}

document.getElementById("prevMonth").onclick=()=>{ currentMonth.setMonth(currentMonth.getMonth()-1); renderCalendar(); };
document.getElementById("nextMonth").onclick=()=>{ currentMonth.setMonth(currentMonth.getMonth()+1); renderCalendar(); };

function renderStats(){
    const div=document.getElementById("statsList");
    div.innerHTML="";
    state.people.forEach(p=>{
        const count = state.trainings.filter(t => (t.people || []).includes(p.id)).length;
        div.innerHTML += `<div>${p.f} ${p.l}: <b>${count}</b></div>`;
    });
}

function render(){
    renderSelected();
    renderPeople();
    renderCalendar();
    renderStats();
}

autoLogin();
</script>
</body>
</html>
