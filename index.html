<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rudertraining App</title>


<style>
:root{
    --bg:#f5f5f7;
    --card:#fff;
    --text:#1d1d1f;
    --sub:#6e6e73;
    --blue:#007aff;
    --border:rgba(0,0,0,0.08);
}

body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,Arial;
    background:var(--bg);
    color:var(--text);
}

.page{display:none;padding-bottom:70px;}
.page.active{display:block;}

.card{
    background:#fff;
    margin:12px;
    padding:14px;
    border-radius:16px;
    box-shadow:0 6px 18px rgba(0,0,0,0.06);
}

input,select{
    width:100%;
    padding:10px;
    margin:6px 0;
    border-radius:12px;
    border:1px solid var(--border);
    background:#fafafa;
}

button{
    width:100%;
    padding:10px;
    border-radius:12px;
    border:none;
    background:var(--blue);
    color:white;
    font-weight:600;
}

/* ITEMS */
.item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    padding:8px;
    border-bottom:1px solid var(--border);
}

.inputs{
    display:flex;
    flex:1;
    gap:6px;
}

.inputs input{
    flex:1;
}

.delete{
    width:32px;
    height:32px;
    background:#ff3b30;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    border-radius:8px;
    cursor:pointer;
}

/* NAV */
.nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:60px;
    background:white;
    border-top:1px solid var(--border);
    display:flex;
}

.nav button{
    flex:1;
    background:none;
    color:var(--sub);
}

.nav button.active{
    color:var(--blue);
}

/* CALENDAR */
.calendar{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:6px;
    text-align:center;
}

.day{
    padding:10px;
    background:#f2f2f5;
    border-radius:12px;
    font-size:12px;
    color:#333;
}

.day:hover{
    background:#e9e9ee;
}

/* TRAINING COLORS */
.day.training{
    color:white;
}

.day.water{
    background:#4da3ff;
}

.day.gym{
    background:#32863d;
}

/* CAL NAV */
.calNav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.calBtn{
    border:none;
    background:transparent;
    color:#9aa0a6;
    font-size:18px;
    cursor:pointer;
}

.calBtn:hover{
    color:#5f6368;
}

.monthLabel{
    font-size:12px;
    color:#8a8a8f;
}

/* STATS FILTER (FIX + TABELLE LOOK) */
.statsFilter{
    display:flex;
    gap:6px;
    margin:10px 12px 0 12px;
}

.statsFilter button{
    flex:1;
    padding:8px;
    border-radius:10px;
    border:1px solid var(--border);
    background:#f2f2f5;
    color:#333;
    font-weight:500;
}

.statsFilter button.active{
    background:var(--blue);
    color:white;
    border-color:transparent;
}

.dateWrap{
    position:relative;
    width:100%;
}

.dateWrap input{
    width:100%;
    padding-right:40px; /* Platz für Icon-Feeling */
    cursor:pointer;
}

</style>
</head>

<body>

<!-- TRAINING -->
<div id="training" class="page active">
<div class="card">
<h3>🚣 Training hinzufügen</h3>

<div class="dateWrap">
    <input type="date" id="date">
</div>
<select id="type">
<option>Wasser</option>
<option>Kraftraum</option>
</select>

<input id="search" placeholder="Person suchen">
<div id="suggestions"></div>
<div id="selected"></div>

<button id="addTraining">Speichern</button>
</div>
</div>

<!-- PERSONEN -->
<div id="people" class="page">
<div class="card">
<h3>👥 Person hinzufügen</h3>

<input id="first" placeholder="Vorname">
<input id="last" placeholder="Nachname">
<button id="addPerson">Hinzufügen</button>
</div>

<div class="card">
<h3>📋 Personenliste</h3>
<div id="peopleList"></div>
</div>
</div>

<!-- STATS -->
<div id="stats" class="page">
<div class="card">

<h3>📅 Kalender</h3>

<div class="calNav">
<button id="prevMonth" class="calBtn">‹</button>
<div class="monthLabel" id="monthLabel"></div>
<button id="nextMonth" class="calBtn">›</button>
</div>

<div id="calendar" class="calendar"></div>

</div>

<div class="card">
<h3>📊 Statistik</h3>
<div class="statsFilter">
    <button data-filter="all" class="active">Alle</button>
    <button data-filter="Wasser">Wasser</button>
    <button data-filter="Kraftraum">Kraftraum</button>
</div>
<div id="statsList"></div>

</div>

</div>

<!-- NAV -->
<div class="nav">
<button data-page="people">Personen</button>
<button class="active" data-page="training">Training</button>
<button data-page="stats">Stats</button>
</div>

<div id="popup" style="
    position:fixed;
    top:0;left:0;right:0;bottom:0;
    background:rgba(0,0,0,0.4);
    display:none;
    justify-content:center;
    align-items:center;
">
    <div id="popupContent" style="
        background:white;
        padding:16px;
        border-radius:16px;
        width:80%;
        max-width:300px;
    "></div>
</div>

<script>

const initialData = {
    people: [
        { id: 1, f: "Max", l: "Mustermann" }
    ],
    trainings: [
        {
            id: 10,
            date: "2026-06-22",
            type: "Wasser",
            people: [1]
        }
    ]
};

// FIRST RUN SETUP
if (!localStorage.getItem("people")) {
    localStorage.setItem("people", JSON.stringify(initialData.people));
}

if (!localStorage.getItem("trainings")) {
    localStorage.setItem("trainings", JSON.stringify(initialData.trainings));
}

const state = {
    people: JSON.parse(localStorage.getItem("people")),
    trainings: JSON.parse(localStorage.getItem("trainings")),
    selected: [],
    statsFilter: "all"
};

let currentMonth = new Date();

function save(){
    localStorage.setItem("people", JSON.stringify(state.people));
    localStorage.setItem("trainings", JSON.stringify(state.trainings));
}

/* NAV */
document.querySelectorAll(".nav button").forEach(btn=>{
    btn.onclick=()=>{
        document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
        btn.classList.add("active");

        document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
        document.getElementById(btn.dataset.page).classList.add("active");
    };
});

/* ADD PERSON */
document.getElementById("addPerson").onclick=()=>{
    const f=document.getElementById("first");
    const l=document.getElementById("last");

    const first=f.value.trim();
    const last=l.value.trim();

    if(!first||!last) return;

    if(state.people.some(p=>p.f===first&&p.l===last)) return;

    state.people.push({id:Date.now(),f:first,l:last});
    save();

    f.value="";
    l.value="";

    render();
};

/* DELETE PERSON */
function deletePerson(id){
    state.people = state.people.filter(p=>p.id!==id);
    state.trainings.forEach(t=>{
        t.people = (t.people||[]).filter(x=>x!==id);
    });
    save();
    render();
}

/* ADD TRAINING */
document.getElementById("addTraining").onclick=()=>{
    const d=document.getElementById("date").value;
    const t=document.getElementById("type").value;

    if(!d) return;

    if(state.trainings.some(x=>x.date===d))
        return alert("Schon Training");

    state.trainings.push({
        id:Date.now(),
        date:d,
        type:t,
        people:[...state.selected]
    });

    state.selected=[];
    save();
    render();
};

/* SEARCH */
document.getElementById("search").oninput=(e)=>{
    const val=e.target.value.toLowerCase();
    const box=document.getElementById("suggestions");
    box.innerHTML="";

    state.people
    .filter(p=>(p.f+" "+p.l).toLowerCase().includes(val))
    .forEach(p=>{
        const div=document.createElement("div");
        div.textContent=p.f+" "+p.l;

        div.onclick=()=>{
    if(!state.selected.includes(p.id)){
        state.selected.push(p.id);
        renderSelected();
    }

    // 🔥 INPUT LEEREN + SUCHERGEBNISSE RESET
    document.getElementById("search").value = "";
    document.getElementById("suggestions").innerHTML = "";
};

        box.appendChild(div);
    });
};

/* SELECTED */
function renderSelected(){
    const div=document.getElementById("selected");
    div.innerHTML="";

    state.selected.forEach(id=>{
        const p=state.people.find(x=>x.id===id);
        if(!p) return;

        const el=document.createElement("div");
        el.className="item";
        el.innerHTML=`${p.f} ${p.l} <span>✕</span>`;

        el.querySelector("span").onclick=()=>{
            state.selected=state.selected.filter(x=>x!==id);
            renderSelected();
        };

        div.appendChild(el);
    });
}

/* PEOPLE */
function renderPeople(){
    const div=document.getElementById("peopleList");
    div.innerHTML="";

    state.people.forEach(p=>{
        const el=document.createElement("div");
        el.className="item";

        const inputs=document.createElement("div");
        inputs.className="inputs";

        const i1=document.createElement("input");
        i1.value=p.f;
        i1.oninput=(e)=>{p.f=e.target.value;save();};

        const i2=document.createElement("input");
        i2.value=p.l;
        i2.oninput=(e)=>{p.l=e.target.value;save();};

        inputs.appendChild(i1);
        inputs.appendChild(i2);

        const del=document.createElement("div");
        del.className="delete";
        del.textContent="×";
        del.onclick=()=>deletePerson(p.id);

        el.appendChild(inputs);
        el.appendChild(del);

        div.appendChild(el);
    });
}

/* CALENDAR */function renderCalendar(){
    const div = document.getElementById("calendar");
    const label = document.getElementById("monthLabel");

    div.innerHTML = "";

    const y = currentMonth.getFullYear();
    const m = currentMonth.getMonth();

    const months = [
        "Januar","Februar","März","April","Mai","Juni",
        "Juli","August","September","Oktober","November","Dezember"
    ];

    label.textContent = months[m];

    const firstDay = new Date(y, m, 1).getDay();
    const days = new Date(y, m + 1, 0).getDate();

    const offset = firstDay === 0 ? 6 : firstDay - 1;

    // leere Felder vor Monatsstart
    for(let i = 0; i < offset; i++){
        div.appendChild(document.createElement("div"));
    }

    // Tage rendern
    for(let d = 1; d <= days; d++){

        const dateStr =
            `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;

        const training = state.trainings.find(t => t.date === dateStr);

        const el = document.createElement("div");
        el.className = "day";
        el.textContent = d;

        if(training){
            el.classList.add("training");

            if(training.type === "Wasser") el.classList.add("water");
            if(training.type === "Kraftraum") el.classList.add("gym");

            // klickbar nur wenn Training existiert
            el.style.cursor = "pointer";
            el.onclick = () => showTraining(training);
        }

        div.appendChild(el);
    }
}

/* MONTH NAV */
document.getElementById("prevMonth").onclick=()=>{
    currentMonth.setMonth(currentMonth.getMonth()-1);
    renderCalendar();
};

document.getElementById("nextMonth").onclick=()=>{
    currentMonth.setMonth(currentMonth.getMonth()+1);
    renderCalendar();
};

/* STATS */
function renderStats(){
    const div=document.getElementById("statsList");
    div.innerHTML="";

    const sorted = [...state.people].map(p => {

    const filtered = state.trainings.filter(t => {
        const isPerson = t.people.includes(p.id);

        if(state.statsFilter === "all") return isPerson;

        return isPerson && t.type === state.statsFilter;
    });

    return {
        name: `${p.f} ${p.l}`,
        count: filtered.length
    };
}).sort((a,b)=>b.count-a.count);

sorted.forEach(r=>{
    div.innerHTML += `${r.name}: <b>${r.count}</b><br>`;
});
}

document.querySelectorAll(".statsFilter button").forEach(btn=>{
    btn.onclick=()=>{
        document.querySelectorAll(".statsFilter button")
            .forEach(b=>b.classList.remove("active"));

        btn.classList.add("active");
        state.statsFilter = btn.dataset.filter;
        renderStats();
    };
});

document.getElementById("date").addEventListener("click", (e)=>{
    e.target.showPicker?.(); // moderne Browser
});
function showTraining(training){
    const box = document.getElementById("popupContent");

    const names = (training.people || [])
        .map(id => {
            const p = state.people.find(x => x.id === id);
            return p ? `${p.f} ${p.l}` : "Unbekannt";
        })
        .join("<br>");

    box.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;">
        <h3 style="margin:0;">${training.type}</h3>

        <!-- ❌ jetzt Schließen oben rechts -->
        <button onclick="closePopup()"
            style="
                width:32px;
                height:32px;
                border:none;
                background:#9aa0a6;
                color:white;
                border-radius:8px;
                font-weight:bold;
                cursor:pointer;
            ">×</button>
    </div>

    <p><b>Personen:</b><br>${names || "Keine"}</p>

    <!-- 🗑 Delete Button unten -->
    <button onclick="deleteTraining(${training.id})"
        style="
            width:100%;
            margin-top:10px;
            border:none;
            background:#ff3b30;
            color:white;
            border-radius:12px;
            padding:10px;
            font-weight:600;
            cursor:pointer;
        ">
        Löschen
    </button>
`;

    document.getElementById("popup").style.display = "flex";
}

function closePopup(){
    document.getElementById("popup").style.display = "none";
}

function deleteTraining(id){
    state.trainings = state.trainings.filter(t => t.id !== id);
    save();
    render();
    closePopup();
}

/* RENDER */
function render(){
    renderSelected();
    renderPeople();
    renderCalendar();
    renderStats();
}

render();

</script>

</body>
</html>
